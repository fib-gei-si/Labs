ServerName www.siupc.cat

<VirtualHost *:80>
    ServerName www.siupc.cat
    DocumentRoot /var/www/html

    OIDCProviderMetadataURL http://sp.siupc.cat:8080/realms/siupc/.well-known/openid-configuration
    OIDCClientID apache_agent
    OIDCRedirectURI http://www.siupc.cat/redirect_uri
    OIDCCryptoPassphrase s3cr3t-passphrase
    OIDCScope "openid profile email"
    OIDCPKCEMethod S256
    OIDCRemoteUserClaim preferred_username

    <Location />
        AuthType openid-connect
        <RequireAll>
            Require valid-user
            Require claim groups:administrator
        </RequireAll>
    </Location>

    <Location /redirect_uri>
        AuthType openid-connect
        Require valid-user
    </Location>
</VirtualHost>
